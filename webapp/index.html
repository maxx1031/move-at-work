<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Just Standup</title>
<style>
  :root { --bg:#0b0f0e; --card:#141b19; --text:#e8f0ed; --muted:#93a39d; --accent:#c6ff3d; --line:#26322e; --warn:#ffb86b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:26px; margin:8px 0 4px; } h1 span { color:var(--accent); }
  p.lead { color:var(--muted); margin:0 0 20px; }
  label.btn, button { display:block; width:100%; text-align:center; padding:16px; border-radius:14px; border:0;
    background:var(--accent); color:#0b0f0e; font-weight:700; font-size:18px; cursor:pointer; }
  input[type=file] { display:none; }
  .hint { color:var(--muted); font-size:14px; margin:10px 2px 0; }
  #status { margin:22px 0 8px; padding:14px; border:1px solid var(--line); border-radius:12px; display:none; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:10px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .3s; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; margin:16px 0; overflow:hidden; }
  .card img { width:100%; display:block; max-height:260px; object-fit:cover; }
  .card .body { padding:14px 16px 16px; }
  .rank { color:var(--accent); font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase; }
  .card h2 { font-size:20px; margin:4px 0 2px; }
  .where { color:var(--muted); margin:0 0 10px; }
  .safety { border-left:3px solid var(--warn); padding:6px 10px; background:#1c1a14; border-radius:6px; font-size:14px; }
  .card a { color:var(--accent); }
  .meta { color:var(--muted); font-size:13px; margin-top:10px; }
  .player { position:relative; aspect-ratio:16/9; margin-top:12px; border-radius:10px; overflow:hidden; background:#000; }
  .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .steps { font-size:14px; color:var(--muted); }
  .links { display:flex; gap:10px; margin-top:12px; }
  .link { flex:1; text-align:center; padding:10px; border:1px solid var(--accent); border-radius:10px; text-decoration:none; font-weight:600; }
  .chips span { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:3px 10px; margin:3px 4px 0 0; font-size:13px; color:var(--muted); }
  .err { color:#ff8a80; }
</style>
</head>
<body>
<main>
  <h1>Just <span>Standup</span></h1>
  <p class="lead">Film your workspace for 10–20 seconds. Slowly pan across chairs, desks, walls and open floor. You'll get three safe exercises that use what's around you.</p>

  <label class="btn" for="video">🎥 Record my workspace</label>
  <input id="video" type="file" accept="video/*" capture="environment">
  <p class="hint">Your video is analyzed in a private, single-use cloud sandbox that is deleted afterwards.</p>

  <div id="status"><div id="stage">Uploading…</div><div class="bar"><div id="progress"></div></div></div>
  <div id="results"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("video").addEventListener("change", () => {
  const file = $("video").files[0];
  if (!file) return;
  $("results").innerHTML = "";
  $("status").style.display = "block";
  setStage("Uploading video…", 0);
  const form = new FormData();
  form.append("video", file);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/uploads");
  xhr.upload.onprogress = (e) => e.lengthComputable && setStage("Uploading video…", 30 * e.loaded / e.total);
  xhr.onload = () => xhr.status === 200 ? poll(JSON.parse(xhr.responseText).id, Date.now())
                                        : setStage(`<span class="err">Upload failed (${xhr.status})</span>`, 0);
  xhr.onerror = () => setStage('<span class="err">Upload failed. Check your connection.</span>', 0);
  xhr.send(form);
});

function setStage(html, pct) { $("stage").innerHTML = html; $("progress").style.width = pct + "%"; }

async function poll(id, started) {
  const r = await fetch(`/api/uploads/${id}`).then((r) => r.json()).catch(() => null);
  const secs = Math.round((Date.now() - started) / 1000);
  if (r && r.status === "done") { setStage(`Done in ${secs}s`, 100); return render(r); }
  if (r && r.status === "error") return setStage(`<span class="err">Something went wrong: ${esc(r.error)}</span>`, 100);
  // Planning takes ~1-2 minutes; creep the bar so it feels alive.
  setStage(`${esc(r ? r.stage : "Working")}… (${secs}s)`, Math.min(95, 30 + secs / 1.6));
  setTimeout(() => poll(id, started), 2000);
}

function render(r) {
  const recs = r.recommendations || [];
  if (!recs.length) { $("results").innerHTML = "<p>No safe spots found. Try filming more of the room.</p>"; return; }
  $("results").innerHTML = recs.map((x) => {
    const e = x.exercise || {};
    const ins = e.instructions || {};
    // Only embeddable players reach here (YouTube); the src is built server-side, never taken from user input.
    const demo = e.video_embed && e.video_embed.startsWith("https://www.youtube-nocookie.com/embed/")
      ? `<div class="player"><iframe src="${esc(e.video_embed)}" title="${esc(e.name)} demo" loading="lazy"
           allow="encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>` : "";
    const links = [e.video_link && `<a class="link" href="${esc(e.video_link)}" target="_blank" rel="noopener">▶ Watch on ExRx</a>`,
                   !e.video_link && e.source_url && `<a class="link" href="${esc(e.source_url)}" target="_blank" rel="noopener">ExRx page</a>`].filter(Boolean).join("");
    const groups = (e.muscle_groups || []).join(", ") || e.section || "";
    return `<div class="card">
      <img src="${esc(x.frame)}" alt="spot ${x.rank}">
      <div class="body">
        <div class="rank">Spot ${x.rank} · ${esc(groups)}</div>
        <h2>${esc(e.name)}</h2>
        <p class="where">at the ${esc(x.object)}</p>
        <p>${esc(x.why)}</p>
        <div class="safety">⚠️ ${esc(x.safety)}</div>
        ${demo}
        ${ins.preparation ? `<p class="steps"><b>Set up:</b> ${esc(ins.preparation)}<br><b>Do:</b> ${esc(ins.execution)}</p>` : ""}
        <div class="links">${links}</div>
        <p class="meta">Targets: ${esc((e.target_muscles || []).join(", ") || groups)}</p>
      </div></div>`;
  }).join("") + (r.other_options && r.other_options.length
      ? `<p class="hint">Also possible here (from your ExRx graph in SurrealDB):</p><div class="chips">${r.other_options.map((o) => `<span>${esc(o)}</span>`).join("")}</div>` : "");
}
</script>
</body>
</html>
